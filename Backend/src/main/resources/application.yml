spring:
  application:
    name: tora
  
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tora}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:20}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 600000
      keepalive-time: 60000
      validation-timeout: 5000
      connection-test-query: SELECT 1
      leak-detection-threshold: 30000
      initialization-fail-timeout: -1
      register-mbeans: true
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  
  # LDAP ayarları artık sadece yönetim panelinden (database) okunuyor
  # Bu ayarlar kullanılmıyor, sadece geriye dönük uyumluluk için tutuluyor
  # ldap:
  #   urls: ${LDAP_URLS:ldap://ldap-test:389}
  #   base: ${LDAP_BASE:dc=test,dc=local}
  #   username: ${LDAP_USERNAME:cn=admin,dc=test,dc=local}
  #   password: ${LDAP_PASSWORD:admin123}
  #   user-search-base: ${LDAP_USER_SEARCH_BASE:ou=users}
  #   user-search-filter: ${LDAP_USER_SEARCH_FILTER:(uid={0})}

# LDAP enabled durumu artık sadece yönetim panelinden (database) okunuyor
# auth:
#   ldap:
#     enabled: ${LDAP_ENABLED:true} # Set to false to disable LDAP and use only local users

server:
  port: ${SERVER_PORT:8080}

# OpenAPI / Swagger — yalnızca 'dev' profilinde aktif (bkz. application-dev.yml).
# Prod'da kapalı: hiçbir doküman endpoint'i açılmaz (saldırı yüzeyi sıfır).
springdoc:
  api-docs:
    enabled: false
    path: /api/v3/api-docs
  swagger-ui:
    enabled: false
    path: /api/docs
    # YAML endpoint'i kapalı — Nginx 8G firewall .yaml uzantısını 403'lüyor
    disable-swagger-default-url: true

jwt:
  secret: ${JWT_SECRET:your-secret-key-change-this-in-production-min-256-bits}
  expiration: ${JWT_EXPIRATION:86400000} # 24 hours in milliseconds

logging:
  level:
    root: INFO
    com.tora: ${LOG_LEVEL:INFO}
    # Spring Security filter-chain "Securing GET /api/..." satırlarını kapat
    org.springframework.security: ${SECURITY_LOG_LEVEL:WARN}
    com.tora.security: ${SECURITY_LOG_LEVEL:WARN}
    # Liquibase changeset spam'ini kapat, hataları aç
    liquibase: WARN
    # Hibernate versiyon/dialect bilgi satırlarını kapat
    org.hibernate: WARN
    org.hibernate.orm.deprecation: ERROR
    # Gereksiz Spring iç detayları
    org.springframework.web.servlet.DispatcherServlet: WARN
    org.springframework.orm.jpa: WARN

app:
  seed:
    sample-data: ${SEED_SAMPLE_DATA:0} # Set to 1 to seed sample data (users, tasks, projects)
  frontend:
    url: ${FRONTEND_URL:http://frontend:80} # Frontend URL for health check (use service name in Docker)
  encryption:
    key: ${ENCRYPTION_KEY:default-encryption-key-change-in-production-min-32-chars-long} # AES encryption key (min 32 chars)
    salt: ${ENCRYPTION_SALT:Tora-v2} # KDF salt — production'da min 16 karakter rastgele değer kullanın
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*} # Comma-separated list of allowed origins, or * for all (development only)
  logging:
    retention:
      system-logs-days: ${LOG_RETENTION_SYSTEM_DAYS:30}
      task-logs-days: ${LOG_RETENTION_TASK_DAYS:90}
  security:
    rate-limit:
      max-attempts: ${RATE_LIMIT_MAX_ATTEMPTS:5} # Maximum login attempts per IP in time window
      window-minutes: ${RATE_LIMIT_WINDOW_MINUTES:15} # Time window in minutes
    account-lockout:
      max-failed-attempts: ${ACCOUNT_LOCKOUT_MAX_ATTEMPTS:10} # Maximum failed attempts before lockout
      lockout-duration-minutes: ${ACCOUNT_LOCKOUT_DURATION_MINUTES:30} # Lockout duration in minutes


# ============================================================
# 8G Firewall v1.5 — nginx port (map blocks, http context)
# https://perishablepress.com/8g-firewall/
# ============================================================

limit_req_zone $binary_remote_addr zone=req_limit:10m rate=30r/s;

# ─── QUERY STRING ────────────────────────────────────────────────────────────
map $args $8g_query_bad {
    default 0;

    # Path traversal / LFI
    ~*((\.\.|%2e%2e)(/|%2f))                                                                    1;
    ~*(etc/(hosts|motd|shadow|passwd)|self/environ|(boot|win)(\.ini))                           1;
    "~*((s)?(ftp|inurl|php)(s)?(:(/|%2f){2}))"                                                 1;

    # SQL injection
    ~*(union.+select.+\()                                                                        1;
    ~*(order(\s|%20)by(\s|%20)1--)                                                              1;
    ~*((\+|%2b)(concat|delete|get|select|union)(\+|%2b))                                       1;
    ~*((concat|eval)\s*\()                                                                       1;
    "~*((;|<|>|%0a|%0d|%27|%22|%3c|%3e|%00).+(alter|base64|benchmark|cast|concat|convert|create|declare|delay|delete|drop|insert|load|replace|script|select|set|sleep|truncate|unhex|update))" 1;

    # Command injection / RCE
    ~*((shell_exec|passthru|phpinfo|proc_open|popen|open_basedir|safe_mode|system)\s*\()       1;
    ~*((allow_url_(fopen|include)|auto_prepend_file|disable_functions|file_put_contents|fsockopen|gethostbyname)) 1;

    # XSS
    ~*(javascript\s*(%3a|:))                                                                     1;
    ~*(base64_(en|de)code\s*\()                                                                 1;
    ~*(<\s*(script|iframe|embed|object))                                                        1;

    # Misc
    ~*(localhost|127\.0\.0\.1)                                                                  1;
    "~*([a-z0-9]{4000,})"                                                                       1;
    ~*((`|%00|%0d%0a))                                                                          1;
}

# ─── REQUEST URI ─────────────────────────────────────────────────────────────
map $request_uri $8g_uri_bad {
    default 0;

    # Webshells
    ~*(/(c99|r57|b374k|alfa|wso|webshell|phpshell|sh3ll)(\.php|\.asp)?)                        1;
    ~*(/(c99|php|web)?sh(3|e)ll[0-9\w]*(\.php))                                                1;

    # Sensitive files
    ~*(/\.(htaccess|htpasswd|env|git|svn|idea|hg)(/|$))                                        1;
    ~*(/(wp-config|config\.inc|configuration\.php)(\.bak|\.old|\.txt|\.php|$))                 1;
    ~*(\.(ds_store|passwd|mysql-select-db)/?$)                                                  1;

    # Dangerous paths
    ~*(/(etc|var)/(shadow|passwd|secret|hidden|ninja)/?$)                                       1;
    ~*(/(bin)/(cc|chmod|chsh|echo|id|kill|perl|ping|ps|python)/?$)                             1;
    ~*(/(cgi-bin|xmlrpc\.php|wp-login\.php))                                                    1;

    # Dangerous extensions
    ~*(\.(asp|aspx|cgi|cfm|cfml|env|exe|sh|bash|pl|bat|cmd|dll|jar|war|php\.(php|suspect))$)  1;
    ~*(\.(7z|ace|bz2|rar|sql|tar|tgz|zip|gz|xz|zlib)$)                                        1;
    ~*(\.(yaml|yml|ini|cfg|conf|config|bak|old|orig|backup)$)                                  1;
    ~*(\.(db|mdb|sqlite|pdb|sdb|dbf)$)                                                         1;

    # Known exploit tools
    ~*((adminer|phpunit|timthumb|wso\.php|alfa\.php|b374k|c99shell|r57shell))                  1;
    ~*((nessus|nikto|sqlmap|zmeu|muieblackcat|mobiquo|telerik))                                 1;

    # RCE in URI
    ~*((eval\(|passthru|shell_exec|base64_decode|system\(|proc_open).*\()                      1;

    # Path traversal
    ~*((/\.\.)+|(%2e%2e(%2f|/))+)                                                               1;

    # Long single segment (scanner behavior)
    "~*([a-z0-9]{2000,})"                                                                       1;
}

# ─── USER AGENT ──────────────────────────────────────────────────────────────
map $http_user_agent $8g_ua_bad {
    default 0;

    "~*([a-z0-9]{2000,})"                                                                       1;
    ~*(%0a|%0d|%27|%3c|%3e|%00)                                                                1;
    ~*((c99|php|web)shell|base64_decode|bin/bash|eval\(|unserializ)                            1;
    ~*(ahrefs|semalt|libwww-perl|pycurl|python-requests|curl|python-urllib)                    1;
    ~*(acapbot|acoonbot|alexibot|antbot|asterias|attackbot|awario|babbar|backdor|barkrowler|becomebot|binlar|bitsightbot|blackwidow|blekkobot|blex|blowfish|bullseye|bunnys|butterfly|bytespider|careerbot|casper|censysinspect) 1;
    ~*(checkpriv|cheesebot|cherrypick|chinaclaw|choppy|claudebot|clshttp|cmsworld|commoncrawl|copernic|copyrightcheck|cosmos|crawlergo|crescent|criteo|datacha|dataforseo|diavol|discobot|dittospyder) 1;
    ~*(dotbot|dotnetdotcom|dumbot|econtext|emailcollector|emailsiphon|emailwolf|eolasbot|eventures|extract|eyenetie|feedfinder|flaming|flashget|flicky|foobot) 1;
    ~*(g00g1e|getright|gigabot|go-ahead-got|go-http-client|gozilla|grabnet|grafula|harvest|heritrix|hrankbot|httracks?|icarus6j|imagesiftbot|intelx|jetbot|jetcar|jikespider|kmccrew|leechftp|libweb|liebaofast) 1;
    ~*(linkscan|linkwalker|lwp-download|majestic|masscan|mauibot|miner|mechanize|mj12bot|morfeus|moveoverbot|mozlila|netmechanic|netspider|nicerspro|nikto|ninja|nominet|nutch) 1;
    ~*(octopus|pagegrabber|petalbot|planetwork|postrank|proximic|purebot|queryn|queryseeker|radian6|radiation|realdownload|remoteview|rogerbot|scooter|scrapy|seekerspid) 1;
    ~*(seokicks|seznambot|siclab|sindice|sistrix|sitebot|siteexplorer|sitesnagger|skygrid|smartdownload|snoopy|sosospider|spankbot|spbot|sqlmap|stackrambler|stripper|sucker|surftbot) 1;
    ~*(sux0r|suzukacz|suzuran|takeout|teleport|telesoft|true_robots|turingos|turnit|tweetmemebot|vampire|vikspider|voideye|webleacher|webreaper|webstripper|webvac|webviewer|webwhacker|wellknownbot) 1;
    ~*(winhttp|wwwoffle|woxbot|xaldon|xxxyy|yamanalab|yioopbot|yisouspider|youda|zeus|zmeu|zoominfobot|zune|zyborg)                                                                         1;
}

# ─── HTTP REFERRER ───────────────────────────────────────────────────────────
map $http_referer $8g_referrer_bad {
    default 0;
    ~*(order(\s|%20)by(\s|%20)1--)                                                              1;
    ~*(@unlink|assert\(|print_r\(|%00|xbshell)                                                 1;
    ~*(100dollars|best-seo|cocaine|ejaculat|erectile|erections|hoodia|impotence|levitra|libido|lipitor|phentermin) 1;
    ~*(pornhelm|semalt\.com|tramadol|valium|viagra|vicodin|xanax)                              1;
}

# ─── HTTP COOKIE ─────────────────────────────────────────────────────────────
map $http_cookie $8g_cookie_bad {
    default 0;
    "~*([<>']|%0A|%0D|%27|%00)"                                                               1;
}

# ─── REQUEST METHOD ──────────────────────────────────────────────────────────
map $request_method $8g_method_bad {
    default 0;
    ~*^(CONNECT|DEBUG|MOVE|TRACE|TRACK)$                                                        1;
}

# ============================================================
# Server block
# ============================================================
server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    add_header X-Content-Type-Options  "nosniff"                          always;
    add_header X-Frame-Options         "SAMEORIGIN"                       always;
    add_header X-XSS-Protection        "1; mode=block"                    always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin"  always;
    add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;

    if ($8g_query_bad)    { return 403; }
    if ($8g_uri_bad)      { return 403; }
    if ($8g_ua_bad)       { return 403; }
    if ($8g_referrer_bad) { return 403; }
    if ($8g_cookie_bad)   { return 403; }
    if ($8g_method_bad)   { return 403; }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|woff|woff2|ttf|eot|webp|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control          "public, immutable"               always;
        add_header X-Content-Type-Options "nosniff"                         always;
        add_header X-Frame-Options        "SAMEORIGIN"                      always;
        add_header X-XSS-Protection       "1; mode=block"                   always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    }

    location /api {
        limit_req zone=req_limit burst=50 nodelay;

        proxy_pass            http://backend:8080;
        proxy_http_version    1.1;
        proxy_set_header      Upgrade           $http_upgrade;
        proxy_set_header      Connection        'upgrade';
        proxy_set_header      Host              $host;
        proxy_cache_bypass    $http_upgrade;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_set_header      X-Forwarded-Host  $host;
        proxy_set_header      X-Forwarded-Port  $server_port;
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }
}
